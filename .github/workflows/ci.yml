name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: JDK ${{ matrix.java }} / ${{ matrix.flink_profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
        flink_profile: [flink-1.20, flink-1.19]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        # Harness is Flink-agnostic; profiles only swap example Flink/connector versions
        # for kafka-core / kafka-avro / jdbc. HTTP examples stay on Flink 2.2.
        run: mvn -B -P${{ matrix.flink_profile }} verify
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          TESTCONTAINERS_HOST_OVERRIDE: localhost
